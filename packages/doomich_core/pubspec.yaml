name: doomich_core
description: Состояние, локальная БД, хранилище токенов, репозитории и голосовая сессия Думыча.
version: 1.0.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  doomich_api:
    path: ../doomich_api
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  shared_preferences: ^2.5.6
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  path_provider: ^2.1.6
  record: ^7.2.0
  audioplayers: ^6.8.1
  connectivity_plus: ^7.3.2
  crypto: ^3.0.8
  uuid: ^4.6.0
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.3
  build_runner: ^2.17.1
