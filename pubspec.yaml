# Dart workspace: общие версии зависимостей для пакетов и двух приложений
name: doomich_workspace
publish_to: none

environment:
  sdk: ^3.13.0

workspace:
  - packages/doomich_api
  - packages/doomich_core
  - packages/doomich_ui
  - apps/mobile
  - apps/desktop

dev_dependencies:
  flutter_lints: ^6.0.0
