global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files: ["/etc/prometheus/rules.yml"]

alerting:
  alertmanagers:
    - static_configs: [{targets: ["alertmanager:9093"]}]

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api-prod:8000"]
        labels: {stack: prod}
      - targets: ["api-stage:8000"]
        labels: {stack: stage}
  - job_name: speech
    static_configs: [{targets: ["asr:8000", "tts:8000"]}]
  - job_name: vllm
    static_configs: [{targets: ["vllm-llm:8000", "vllm-embed:8000", "vllm-rerank:8000"]}]
  - job_name: node
    static_configs: [{targets: ["node-exporter:9100"]}]
  - job_name: cadvisor
    static_configs: [{targets: ["cadvisor:8080"]}]
  - job_name: gpu
    static_configs: [{targets: ["dcgm-exporter:9400"]}]
