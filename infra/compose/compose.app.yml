# Стек приложения: Core API, фоновые задачи, PostgreSQL, Valkey, ClamAV.
# На сервере пилота запускается дважды: stage и prod, это разные проекты compose
# со своими БД и томами:
#   docker compose -p doomich-prod  -f compose.app.yml --env-file .env.prod  up -d
#   docker compose -p doomich-stage -f compose.app.yml --env-file .env.stage up -d
# Модельный слой (compose.models.yml) общий, стеки ходят к нему по сети doomich-models.

x-api-env: &api-env
  DOOMICH_ENV: ${DOOMICH_ENV:-prod}
  DOOMICH_PUBLIC_BASE_URL: ${PUBLIC_BASE_URL}
  DOOMICH_CORS_ORIGINS: ${ADMIN_ORIGIN}
  DOOMICH_REDIS_URL: redis://valkey:6379/0
  DOOMICH_DATA_DIR: /data
  DOOMICH_SECRETS_DIR: /run/secrets
  DOOMICH_CLAMD_HOST: clamav
  DOOMICH_LLM_BACKEND: vllm
  DOOMICH_LLM_URL: http://vllm-llm:8000/v1
  DOOMICH_LLM_MODEL: ${LLM_MODEL}
  DOOMICH_EMBED_BACKEND: vllm
  DOOMICH_EMBED_URL: http://vllm-embed:8000/v1
  DOOMICH_EMBED_MODEL: ${EMBED_MODEL}
  DOOMICH_RERANK_BACKEND: vllm
  DOOMICH_RERANK_URL: http://vllm-rerank:8000/v1
  DOOMICH_RERANK_MODEL: ${RERANK_MODEL}
  DOOMICH_ASR_BACKEND: http
  DOOMICH_ASR_URL: http://asr:8000
  DOOMICH_TTS_BACKEND: http
  DOOMICH_TTS_URL: http://tts:8000
  DOOMICH_TTS_FORMAT: ogg_opus
  DOOMICH_NAV_BACKEND: http
  DOOMICH_NAV_URL: http://nav:8000
  DOOMICH_SENTRY_DSN: ${SENTRY_DSN:-}
  DOOMICH_LOG_LEVEL: INFO

x-api: &api
  image: ${REGISTRY}/doomich-api:${TAG}
  restart: unless-stopped
  environment: *api-env
  secrets: &api-secrets
    - doomich_jwt_secret
    - doomich_master_keys
    - doomich_invite_pepper
    - doomich_database_url
    - doomich_database_sys_url
  volumes:
    - files:/data
  depends_on:
    postgres: {condition: service_healthy}
    valkey: {condition: service_healthy}
  networks: [app, models]
  logging: &logging
    driver: json-file
    options: {max-size: "20m", max-file: "5"}

services:
  postgres:
    image: pgvector/pgvector:${PG_TAG:-0.8.1-pg17}
    restart: unless-stopped
    environment:
      POSTGRES_DB: doomich
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/db_sys_password
    secrets: [db_sys_password, db_app_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-doomich.sh:ro
    command: >
      postgres -c shared_buffers=${PG_SHARED_BUFFERS:-2GB} -c effective_cache_size=${PG_CACHE:-6GB}
      -c maintenance_work_mem=512MB -c max_connections=200 -c log_connections=off -c log_disconnections=off
      -c log_line_prefix='%m [%p] %q%u@%d '
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doomich"]
      interval: 10s
      retries: 10
    networks: [app]
    logging: *logging

  valkey:
    image: valkey/valkey:${VALKEY_TAG:-8.1-alpine}
    restart: unless-stopped
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "1gb", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
    networks: [app]
    logging: *logging

  clamav:
    image: clamav/clamav:${CLAMAV_TAG:-1.4}
    restart: unless-stopped
    volumes:
      - clamav:/var/lib/clamav
    networks: [app]
    logging: *logging

  migrate:
    <<: *api
    restart: "no"
    # Миграции идут под ролью doomich_sys (секрет doomich_database_sys_url)
    command: ["doomich-manage", "migrate"]

  api:
    <<: *api
    command: ["uvicorn", "--factory", "doomich.main:create_app", "--host", "0.0.0.0", "--port", "8000",
              "--proxy-headers", "--forwarded-allow-ips", "*", "--no-access-log", "--workers", "${API_WORKERS:-2}"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    networks:
      app: {}
      models: {}
      # nginx различает стеки по имени: api-prod или api-stage
      edge:
        aliases: ["api-${STACK:-prod}"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 15s

  worker:
    <<: *api
    # Документы, расписание, обслуживание. Конспекты отдельно, чтобы не мешали документам.
    command: ["celery", "-A", "doomich.worker.app", "worker", "-Q", "documents,schedule,maintenance",
              "--concurrency", "${WORKER_CONCURRENCY:-4}", "--without-gossip", "-n", "main@%h"]

  worker-lectures:
    <<: *api
    command: ["celery", "-A", "doomich.worker.app", "worker", "-Q", "lectures", "--concurrency", "2",
              "--without-gossip", "-n", "lectures@%h"]

  beat:
    <<: *api
    command: ["celery", "-A", "doomich.worker.app", "beat", "--schedule", "/data/celerybeat-schedule"]

secrets:
  db_sys_password: {file: ./secrets/db_sys_password}
  db_app_password: {file: ./secrets/db_app_password}
  doomich_jwt_secret: {file: ./secrets/doomich_jwt_secret}
  doomich_master_keys: {file: ./secrets/doomich_master_keys}
  doomich_invite_pepper: {file: ./secrets/doomich_invite_pepper}
  doomich_database_url: {file: ./secrets/doomich_database_url}
  doomich_database_sys_url: {file: ./secrets/doomich_database_sys_url}

volumes:
  pgdata:
  files:
  clamav:

networks:
  app:
  models:
    name: doomich-models
    external: true
  edge:
    name: doomich-edge
    external: true
