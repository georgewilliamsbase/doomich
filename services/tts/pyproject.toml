[project]
name = "doomich-tts"
version = "1.0.0"
description = "Сервис синтеза речи Думыча: нормализация русского текста, ударения, модели по итогам бенчмарка"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic-settings>=2.6",
  "numpy>=2.1",
  "httpx>=0.28",
  "prometheus-client>=0.21",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4"]
chatterbox = ["chatterbox-tts>=0.1.2"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomich_tts"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"src/doomich_tts/normalize/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
