[project]
name = "doomich-api"
version = "1.0.0"
description = "Core API Думыча: аккаунты, вузы, чаты, расписание, документы, голосовой шлюз, админ-API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3.6",
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  "cryptography>=44",
  "redis>=5.2",
  "celery>=5.4",
  "httpx>=0.28",
  "python-multipart>=0.0.20",
  "openpyxl>=3.1.5",
  "icalendar>=6.1",
  "python-dateutil>=2.9",
  "pypdf>=5.1",
  "python-docx>=1.1.2",
  "python-pptx>=1.0.2",
  "beautifulsoup4>=4.12",
  "qrcode>=8.0",
  "reportlab>=4.2",
  "pyotp>=2.9",
  "prometheus-client>=0.21",
  "numpy>=2.1",
  "pillow>=11",
]

[project.optional-dependencies]
# Docling тянет torch и модели разметки, ставится только в образ воркера документов
docling = ["docling>=2.15"]
ocr = ["pytesseract>=0.3.13"]
# Маскирование ПД через NER (R1.1)
ner = ["natasha>=1.6"]
sentry = ["sentry-sdk>=2.19"]

[project.scripts]
doomich-manage = "doomich.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/doomich"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = [
  "S101",   # assert в тестах
  "S311",   # random не для криптографии там, где это явно
  "RUF001", "RUF002", "RUF003",  # кириллица в строках и комментариях это нормально
  "B008",   # Depends() в аргументах FastAPI
  "UP047",  # TypeVar в старом стиле читается привычнее
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S107", "S108", "E501"]
"src/doomich/orchestrator/prompts.py" = ["E501"]
"migrations/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
